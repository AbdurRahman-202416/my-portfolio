<svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background fill -->
  <rect width="100" height="100" fill="#0a192f" rx="16"/>
  <!-- Outer hexagon -->
  <polygon
    points="50,6 92,28 92,72 50,94 8,72 8,28"
    fill="none"
    stroke="url(#grad)"
    stroke-width="4"
    filter="url(#glow)"
  />
  <!-- Inner subtle fill -->
  <polygon
    points="50,18 82,35 82,65 50,82 18,65 18,35"
    fill="url(#grad)"
    fill-opacity="0.1"
  />
  <!-- AR monogram -->
  <text
    x="50"
    y="59"
    text-anchor="middle"
    fill="url(#grad)"
    font-size="30"
    font-weight="900"
    font-family="'Courier New', monospace"
    letter-spacing="-1"
    filter="url(#glow)"
  >AR</text>
</svg>
